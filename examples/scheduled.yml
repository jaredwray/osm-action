# TEMPLATE: replace PINNED_OSM_ACTION_COMMIT with a reviewed full commit SHA.
name: OSM scheduled inspection
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: jaredwray/osm-action@PINNED_OSM_ACTION_COMMIT
        with:
          osm-token: ${{ secrets.OSM_API_TOKEN }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
